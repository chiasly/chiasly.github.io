<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chiasly Portfolio</title>
  <link rel="stylesheet" href="styles.css">
  <script src="scripts.js" defer></script>
</head>
<body>
  <!-- Header -->
  <header>
    <h1>Chiasly Portfolio</h1>
    <nav>
      <ul>
        <li><button class="tab-btn active" data-tab="portfolio">Portfolio</button></li>
        <li><button class="tab-btn" data-tab="bio">Bio</button></li>
        <li><button class="tab-btn" data-tab="contact">Contact</button></li>
      </ul>
    </nav>
  </header>

  <!-- Tabs Content -->
  <section id="portfolio" class="tab-content active">
    <div class="grid" id="photo-grid">
      <div class="grid-item"><img src="images/photo_1_1.jpg" alt="Photo 1"></div>
      <div class="grid-item"><img src="images/photo_1_2.jpg" alt="Photo 2"></div>
      <div class="grid-item"><img src="images/photo_1_3.jpg" alt="Photo 3"></div>
      <div class="grid-item"><img src="images/photo_1_4.jpg" alt="Photo 4"></div>
      <div class="grid-item"><img src="images/photo_1_5.jpg" alt="Photo 5"></div>
      <div class="grid-item"><img src="images/photo_1_6.jpg" alt="Photo 6"></div>
      <div class="grid-item"><img src="images/photo_1_7.jpg" alt="Photo 7"></div>
      <div class="grid-item"><img src="images/photo_1_8.jpg" alt="Photo 8"></div>
      <div class="grid-item"><img src="images/photo_1_9.jpg" alt="Photo 9"></div>
      <div class="grid-item"><img src="images/photo_1_10.jpg" alt="Photo 10"></div>
      <div class="grid-item"><img src="images/photo_1_11.jpg" alt="Photo 11"></div>
      <div class="grid-item"><img src="images/photo_1_12.jpg" alt="Photo 12"></div>
      <div class="grid-item"><img src="images/photo_1_13.jpg" alt="Photo 13"></div>
      <div class="grid-item"><img src="images/photo_1_14.jpg" alt="Photo 14"></div>
      <div class="grid-item"><img src="images/photo_1_15.jpg" alt="Photo 15"></div>
      <div class="grid-item"><img src="images/photo_1_16.jpg" alt="Photo 16"></div>
    </div>
    <div id="loading">Loading more...</div>
  </section>

  <section id="bio" class="tab-content">
    <p>Insert your bio here. Include experience, education, and relevant info for the assistant application.</p>
  </section>

  <section id="contact" class="tab-content">
    <p>Email: max@example.com</p>
    <p>Phone: (XXX) XXX-XXXX</p>
  </section>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <img class="lightbox-img" src="">
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 LQF Productions</p>
  </footer>
</body>
</html>
